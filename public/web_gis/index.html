    <script>
        // GSAP Animation for Layer Switcher
        document.addEventListener('DOMContentLoaded', function () {
            // Find the button and panel
            const observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (mutation) {
                    if (mutation.attributeName === 'class') {
                        const target = mutation.target;
                        if (target.classList.contains('shown')) {
                            // Panel Opened

                            // 1. Animate the Header
                            // Although strictly pseudo-element, we can't animate it directly with GSAP easily, 
                            // but the container expansion is handled by CSS. 
                            // Let's animate the list items!

                            const items = target.querySelectorAll('li');
                            gsap.fromTo(items,
                                { opacity: 0, x: 20, autoAlpha: 0 },
                                {
                                    opacity: 1,
                                    x: 0,
                                    autoAlpha: 1,
                                    duration: 0.4,
                                    stagger: 0.05,
                                    ease: "power2.out",
                                    delay: 0.1
                                }
                            );

                            // Animate Close Button
                            const closeBtn = target.querySelector('button');
                            if (closeBtn) {
                                gsap.fromTo(closeBtn,
                                    { rotate: -90, opacity: 0 },
                                    { rotate: 0, opacity: 1, duration: 0.4, ease: "back.out(1.7)", delay: 0.2 }
                                );
                            }

                        }
                    }
                });
            });

            // Start observing the layer switcher for class changes
            const layerSwitcher = document.querySelector('.layer-switcher');
            if (layerSwitcher) {
                observer.observe(layerSwitcher, { attributes: true });
            }
        });
    </script>
